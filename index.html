<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Astra Sovereign</title>

    <!-- viewport-fit=cover: permite usar a area do notch via safe-area-inset-*.
         user-scalable=no + maximum-scale=1: mata o zoom por duplo-toque e por pinca,
         que no iOS atrapalha qualquer controle de toque. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Adicionar a Home Screen: roda em tela cheia, sem barra do Safari.
         Isso tambem reduz o risco do ITP apagar o save (ver docs/decisions/0001). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Astra Sovereign" />
    <meta name="theme-color" content="#05060f" />

    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060f;
        color: #e8ecff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

        /* Sem selecao de texto, sem menu de toque longo, sem highlight azul,
           sem scroll elastico. Tudo isso quebra a sensacao de "app" no iOS. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Tela de boot. Se o JS falhar antes de iniciar, ela fica visivel --
         o que ja e um diagnostico util em um iPhone sem DevTools. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #05060f;
        z-index: 100;
        transition: opacity 0.3s ease;
      }

      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8fa4ff;
      }

      #boot p {
        font-size: 13px;
        color: #5a6488;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="boot">
      <h1>Astra Sovereign</h1>
      <p>Carregando...</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
