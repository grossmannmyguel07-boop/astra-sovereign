<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Astra Sovereign — Benchmark</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05060f" />

    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060f;
        color: #e8ecff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* O benchmark mede o aparelho, nao o navegador em retrato. Medir com a
         tela na proporcao errada produziria um numero que nao se compara com
         nada -- o jogo so roda em paisagem. */
      #retrato {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: #05060f;
        z-index: 200;
      }

      @media (orientation: portrait) {
        #retrato {
          display: flex;
        }
      }

      #retrato strong {
        font-size: 17px;
        color: #8fa4ff;
        letter-spacing: 0.08em;
      }

      #retrato span {
        font-size: 13px;
        line-height: 1.6;
        color: #5a6488;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="retrato">
      <strong>GIRE O APARELHO</strong>
      <span>
        O benchmark so mede em paisagem.<br />
        Medir em retrato daria um numero incomparavel.
      </span>
    </div>

    <script type="module" src="/src/bench/main.ts"></script>
  </body>
</html>
